<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonir Shaik | Google Images Gallery</title>
  <meta name="description" content="Tonir Shaik's photo collection optimized for Google Images. High quality photos with direct links.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Tonir Shaik">
  <link rel="canonical" href="https://tonirshaik.github.io/tonir-google-image/">

  <!-- Open Graph -->
  <meta property="og:title" content="Tonir Shaik | Google Images Gallery">
  <meta property="og:description" content="Tonir Shaik's photo collection optimized for Google Images.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tonirshaik.github.io/tonir-google-image/">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      line-height: 1.5;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 0 40px;
      border-bottom: 1px solid #222;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    header h1 span {
      color: #60a5fa;
    }

    header p {
      margin-top: 8px;
      color: #888;
      font-size: 15px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .photo {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
      vertical-align: middle;
    }

    .photo .caption {
      padding: 12px 14px;
      font-size: 14px;
      color: #aaa;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding: 30px 0;
      color: #555;
      font-size: 13px;
      border-top: 1px solid #222;
    }

    footer a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tonir <span>Shaik</span></h1>
    <p>Google Images Optimized Photo Gallery</p>
  </header>

  <div class="gallery">

    <!-- 
      ==============================
      এখানে নতুন ছবি যোগ করবে
      ==============================
      ImgBB তে আপলোড করার পর Direct link নিয়ে নিচের মতো করে বসাও
    -->

    <div class="photo">
      <img src="https://i.ibb.co/example1.jpg" alt="Tonir Shaik photo 1" title="Tonir Shaik">
      <div class="caption">Tonir Shaik</div>
    </div>

    <div class="photo">
      <img src="https://i.ibb.co/example2.jpg" alt="Tonir Shaik photo 2" title="Tonir Shaik">
      <div class="caption">Tonir Shaik</div>
    </div>

    <div class="photo">
      <img src="https://i.ibb.co/example3.jpg" alt="Tonir Shaik photo 3" title="Tonir Shaik">
      <div class="caption">Tonir Shaik</div>
    </div>

    <!-- আরও ছবি যোগ করতে চাইলে উপরের ব্লক কপি করে নিচে বসাও -->

  </div>

  <footer>
    © 2026 Tonir Shaik · 
    <a href="https://tonirshaik.github.io/tonirshaik/" target="_blank">Main Gallery</a>
  </footer>

</body>
</html>
